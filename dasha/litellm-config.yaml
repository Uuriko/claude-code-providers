# Dasha Compute via LiteLLM (proxy traductor - ver _docs/proxies.md)
# 1) Mint a 24h guest key:  curl -X POST https://www.getdasha.com/compute/api/guest-keys
#    (response field: api_key, prefix dgk_)
# 2) export DASHA_GUEST_KEY=dgk_...
# 3) litellm --config litellm-config.yaml --port 4000
# Live model list: https://www.getdasha.com/compute/api/v1/models
model_list:
  - model_name: qwen3-4b
    litellm_params:
      model: openai/qwen3-4b
      api_base: https://www.getdasha.com/compute/api/v1
      api_key: os.environ/DASHA_GUEST_KEY
  - model_name: qwen3-8b
    litellm_params:
      model: openai/qwen3-8b
      api_base: https://www.getdasha.com/compute/api/v1
      api_key: os.environ/DASHA_GUEST_KEY
  - model_name: gemma3-12b
    litellm_params:
      model: openai/gemma3-12b
      api_base: https://www.getdasha.com/compute/api/v1
      api_key: os.environ/DASHA_GUEST_KEY
  - model_name: gemma3-27b
    litellm_params:
      model: openai/gemma3-27b
      api_base: https://www.getdasha.com/compute/api/v1
      api_key: os.environ/DASHA_GUEST_KEY
